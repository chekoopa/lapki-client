services:
  release:
    build:
      context: .
      dockerfile: Dockerfile.release
    working_dir: /project
    volumes:
      - .:/project
      - .:/host-project
      - node-modules:/project/node_modules
      - release-out:/project/out
      - release-dist:/project/dist
      - release-outputs:/project/outputs
      - npm-cache:/root/.npm
      - electron-cache:/root/.cache/electron
      - electron-builder-cache:/root/.cache/electron-builder
      - release-download-cache:/cache/release-downloads
    environment:
      RELEASE_DOWNLOAD_CACHE: /cache/release-downloads
      RELEASE_ARTIFACTS_DIR: /host-project
      RELEASE_LINUX_TARGETS: "${RELEASE_LINUX_TARGETS:-AppImage snap deb}"
    command: bash build/release-linux-windows.sh

volumes:
  node-modules:
  release-out:
  release-dist:
  release-outputs:
  npm-cache:
  electron-cache:
  electron-builder-cache:
  release-download-cache:

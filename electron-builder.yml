appId: ru.kruzhok.lapki-ide
productName: Lapki IDE
directories:
  buildResources: build
files:
  - '!build/lapki-compiler/**'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# TODO: afterSign: build/notarize.js
win:
  executableName: lapki-ide
nsis:
  artifactName: ${name}-v${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  include: build-installer/installer.nsh
mac:
  artifactName: ${name}-v${version}.${ext}
  target:
    - target: dmg
      arch: universal
  category: 'public.app-category.developer-tools'
  entitlementsInherit: build/entitlements.mac.plist
linux:
  artifactName: ${name}-v${version}.${ext}
  # Вырезаем не-линуксовые модули из формируемых дистрибутивов.
  files:
    - '!resources/modules/win32/**'
    - '!resources/modules/darwin/**'
  target:
    - AppImage
    - snap
    - deb
    # TODO: - rpm
  maintainer: electronjs.org
  category: Utility
deb:
  afterInstall: build/udev-rules.sh
npmRebuild: false
publish:
  provider: generic
  url: https://github.com/kruzhok-team/lapki-client
